# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
# they're already public — declaring them inline is fine.
# Everything else (Admin SDK, Flutterwave, Africa's Talking, JWT secret,
# demo-reset token, Lira shared secret) references Google Secret Manager.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # ---------- Firebase client (public) ----------
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAo4E9C6QdZd0D-dMsCNbdKBVHW_xgt3OM
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: lemonpay-4a701.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: lemonpay-4a701
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: lemonpay-4a701.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "620666985097"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:620666985097:web:8fdfb05277925096550458
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: "true"
    availability: [BUILD, RUNTIME]

  # ---------- Firebase Admin (server-only) ----------
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: lemonpay-4a701
    availability: [RUNTIME]
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
    availability: [RUNTIME]
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability: [RUNTIME]

  # ---------- Africa's Talking ----------
  - variable: AT_USERNAME
    value: sandbox
    availability: [RUNTIME]
  - variable: AT_SENDER_ID
    value: LEMONPAY
    availability: [RUNTIME]
  - variable: AT_API_KEY
    secret: AT_API_KEY
    availability: [RUNTIME]

  # ---------- Flutterwave (kept around for webhook signature only) ----------
  - variable: FLW_PUBLIC_KEY
    secret: FLW_PUBLIC_KEY
    availability: [RUNTIME]
  - variable: FLW_SECRET_KEY
    secret: FLW_SECRET_KEY
    availability: [RUNTIME]
  - variable: FLW_SECRET_HASH
    secret: FLW_SECRET_HASH
    availability: [RUNTIME]

  # ---------- Lira integration ----------
  - variable: LIRA_API_BASE
    secret: LIRA_API_BASE
    availability: [RUNTIME]
  - variable: LIRA_SHARED_SECRET
    secret: LIRA_SHARED_SECRET
    availability: [RUNTIME]

  # ---------- Demo + auth ----------
  - variable: DEMO_RESET_TOKEN
    secret: DEMO_RESET_TOKEN
    availability: [RUNTIME]
  - variable: OTP_JWT_SECRET
    secret: OTP_JWT_SECRET
    availability: [RUNTIME]
